name: Repos

# Refreshes the auto-generated repository list in the profile README:
# every public, non-fork repository of the owner, rebuilt on a schedule
# and whenever the repo list can change (new or renamed repo).
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate the repository list
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_repos.py
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "README is up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "repos: refresh the repository list"
          git push
