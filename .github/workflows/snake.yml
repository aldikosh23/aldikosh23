name: Snake

# Redraws the contribution-graph snake twice a day and publishes it to the `output` branch.
on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#1f9d74&color_dots=#ebedf0,#b4ecd3,#6fd3a8,#2fbf8c,#16805d
            dist/snake-dark.svg?palette=github-dark&color_snake=#5ee0b0&color_dots=#161b22,#0f3b2c,#16664a,#23a173,#5ee0b0

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
